name: Tourism MLOps Pipeline

# ---------------------------------------------------------------------------
# Workflow triggers
# ---------------------------------------------------------------------------

on:
  # Automatically run the ML pipeline when relevant changes reach main
  push:
    branches:
      - main

    # Model artifacts are generated by this workflow itself.
    # Ignoring artifact-only commits prevents an unnecessary retraining loop.
    paths-ignore:
      - "tourism_project/deployment/best_model.joblib"
      - "tourism_project/deployment/model_metrics.json"

  # Allow the workflow to be started manually from the GitHub Actions interface
  workflow_dispatch:


# ---------------------------------------------------------------------------
# Repository permissions
# ---------------------------------------------------------------------------

# The final training job requires write access because it commits the newly
# generated production model artifacts back to the repository.
permissions:
  contents: write


# ===========================================================================
# JOB 1: DATA REGISTRATION
# ===========================================================================

jobs:

  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:

      # Download the current repository contents onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure the Python runtime used by the ML pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the dependencies required by the production ML scripts
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/model_building/requirements.txt

      # Validate the raw tourism dataset and its required schema
      - name: Register and validate dataset
        run: |
          python tourism_project/model_building/data_register.py

      # Make the validated raw dataset available to the next workflow job
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          retention-days: 1


# ===========================================================================
# JOB 2: DATA PREPARATION
# ===========================================================================

  data-prep:
    name: Prepare Production Data
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:

      # Checkout ensures that prep.py and the project structure are available
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the same Python version throughout the automated pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the common ML dependencies
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/model_building/requirements.txt

      # Retrieve the validated dataset produced by the registration job
      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      # Execute the production-safe data preparation script
      # This removes identifiers and post-contact variables and creates
      # stratified train/test datasets.
      - name: Run data preparation
        run: |
          python tourism_project/model_building/prep.py

      # Pass the prepared splits to the model-training job
      - name: Upload prepared train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed/
          retention-days: 1


# ===========================================================================
# JOB 3: MODEL TRAINING, TRACKING, AND ARTIFACT UPDATE
# ===========================================================================

  model-training:
    name: Train and Track Production Model
    needs: data-prep
    runs-on: ubuntu-latest

    steps:

      # Checkout the repository so that train.py and deployment files are available
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Python for the training environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install XGBoost, scikit-learn, MLflow, and supporting dependencies
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/model_building/requirements.txt

      # Download the exact prepared datasets produced by the previous job
      - name: Download prepared train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed

      # Start a local MLflow server for production experiment tracking
      # train.py uses http://127.0.0.1:5000 by default.
      - name: Start MLflow tracking server
        run: |
          nohup mlflow ui \
            --host 127.0.0.1 \
            --port 5000 \
            > mlflow.log 2>&1 &

          # Wait until the MLflow server is ready before starting training
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000 >/dev/null; then
              echo "MLflow server is ready."
              break
            fi

            echo "Waiting for MLflow server..."
            sleep 2
          done

      # Execute the standalone production training script
      # This performs preprocessing, GridSearchCV, MLflow tracking,
      # evaluation, and deployment artifact generation.
      - name: Train production model
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python tourism_project/model_building/train.py

      # Preserve the generated deployment model and metadata as workflow artifacts
      # in addition to committing them back to GitHub.
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            tourism_project/deployment/best_model.joblib
            tourism_project/deployment/model_metrics.json
          retention-days: 7

      # Configure Git identity for the automated artifact commit
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Stage only the model artifacts generated by train.py.
      # app.py and requirements.txt remain normal version-controlled source files.
      - name: Commit updated production model
        run: |
          git add \
            tourism_project/deployment/best_model.joblib \
            tourism_project/deployment/model_metrics.json

          # Commit only when the training run produced actual file changes
          if git diff --cached --quiet; then
            echo "No model artifact changes detected."
          else
            git commit -m "Update production model artifacts [skip ci]"
            git push
          fi
