
name: Tourism MLOps Pipeline


# ===========================================================================
# STEP 4.1 - DEFINE WORKFLOW TRIGGERS
# ===========================================================================

on:

  # Automatically run the pipeline when relevant changes are pushed to main
  push:
    branches:
      - main

    # The workflow itself updates these model artifacts.
    # Ignoring artifact-only changes prevents a retraining loop.
    paths-ignore:
      - "tourism_project/deployment/best_model.joblib"
      - "tourism_project/deployment/model_metrics.json"

  # Allow the workflow to be started manually from GitHub Actions
  workflow_dispatch:


# ===========================================================================
# STEP 4.2 - DEFINE REPOSITORY PERMISSIONS
# ===========================================================================

# The final training job needs write access because it can commit
# newly generated production model artifacts back to the repository.
permissions:
  contents: write


# ===========================================================================
# STEP 4.3 - JOB 1: REGISTER DATASET
# ===========================================================================

jobs:

  register-dataset:

    name: Register Dataset
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------------------
      # Step 4.3.1 - Checkout repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------------------
      # Step 4.3.2 - Configure Python
      # ---------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------------------
      # Step 4.3.3 - Install ML dependencies
      # ---------------------------------------------------------------------

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/model_building/requirements.txt


      # ---------------------------------------------------------------------
      # Step 4.3.4 - Register and validate raw dataset
      # ---------------------------------------------------------------------

      - name: Register and validate dataset
        run: |
          python tourism_project/model_building/data_register.py


      # ---------------------------------------------------------------------
      # Step 4.3.5 - Upload registered dataset
      # ---------------------------------------------------------------------

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          retention-days: 1


# ===========================================================================
# STEP 4.4 - JOB 2: PREPARE PRODUCTION DATA
# ===========================================================================

  data-prep:

    name: Prepare Production Data

    # Run only after successful data registration
    needs: register-dataset

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------------------
      # Step 4.4.1 - Checkout repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------------------
      # Step 4.4.2 - Configure Python
      # ---------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------------------
      # Step 4.4.3 - Install ML dependencies
      # ---------------------------------------------------------------------

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/model_building/requirements.txt


      # ---------------------------------------------------------------------
      # Step 4.4.4 - Download registered dataset
      # ---------------------------------------------------------------------

      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data


      # ---------------------------------------------------------------------
      # Step 4.4.5 - Run production-safe data preparation
      # ---------------------------------------------------------------------

      - name: Run data preparation
        run: |
          python tourism_project/model_building/prep.py


      # ---------------------------------------------------------------------
      # Step 4.4.6 - Upload prepared train/test splits
      # ---------------------------------------------------------------------

      - name: Upload prepared train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed/
          retention-days: 1


# ===========================================================================
# STEP 4.5 - JOB 3: TRAIN AND TRACK PRODUCTION MODEL
# ===========================================================================

  model-training:

    name: Train and Track Production Model

    # Run only after successful production data preparation
    needs: data-prep

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------------------
      # Step 4.5.1 - Checkout repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------------------
      # Step 4.5.2 - Configure Python
      # ---------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------------------
      # Step 4.5.3 - Install training and MLflow dependencies
      # ---------------------------------------------------------------------

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/model_building/requirements.txt


      # ---------------------------------------------------------------------
      # Step 4.5.4 - Download prepared train/test datasets
      # ---------------------------------------------------------------------

      - name: Download prepared train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed


      # ---------------------------------------------------------------------
      # Step 4.5.5 - Start local MLflow tracking server
      # ---------------------------------------------------------------------

      - name: Start MLflow tracking server
        run: |

          nohup mlflow ui \
            --host 127.0.0.1 \
            --port 5000 \
            > mlflow.log 2>&1 &

          # Wait until MLflow is available before starting model training
          for i in {1..20}; do

            if curl --silent --fail http://127.0.0.1:5000 >/dev/null; then
              echo "MLflow server is ready."
              break
            fi

            echo "Waiting for MLflow server..."
            sleep 2

          done


      # ---------------------------------------------------------------------
      # Step 4.5.6 - Execute standalone production training
      # ---------------------------------------------------------------------

      - name: Train production model
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python tourism_project/model_building/train.py


      # ---------------------------------------------------------------------
      # Step 4.5.7 - Upload final deployment artifacts
      # ---------------------------------------------------------------------

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            tourism_project/deployment/best_model.joblib
            tourism_project/deployment/model_metrics.json
          retention-days: 7


      # ---------------------------------------------------------------------
      # Step 4.5.8 - Configure Git identity
      # ---------------------------------------------------------------------

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ---------------------------------------------------------------------
      # Step 4.5.9 - Commit updated production artifacts
      # ---------------------------------------------------------------------

      - name: Commit updated production model
        run: |

          git add \
            tourism_project/deployment/best_model.joblib \
            tourism_project/deployment/model_metrics.json

          # Only create a commit when training changed the artifacts
          if git diff --cached --quiet; then

            echo "No model artifact changes detected."

          else

            git commit -m "Update production model artifacts [skip ci]"
            git push

          fi
